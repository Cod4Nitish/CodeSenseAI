<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CodeSense AI — Code Review by Nitish Kumar Singh</title>
    <meta name="description" content="AI-powered code review tool built by Nitish Singh. Detects bugs, security vulnerabilities, performance issues and style violations using Google Gemini AI." />
    <meta name="author" content="Nitish Kumar Singh" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CodeSense" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="CodeSense AI — Intelligent Code Review" />
    <meta property="og:description" content="Paste your code, get instant AI-powered bug detection and fix suggestions. by Nitish Singh" />

    <!-- Apply saved theme before first paint (no flash). Mirrors src/lib/theme.js -->
    <script>
      (function () {
        var st = {};
        try { st = JSON.parse(localStorage.getItem("codesense_settings") || "{}") || {}; } catch (e) {}
        var P = { lofi: 1, pastel: 1, graphite: "dark", paper: "light", arctic: "light" };
        var F = {
          lofi: "family=Syne:wght@600;800&family=Space+Mono:wght@400;700",
          pastel: "family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600",
          graphite: "family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600",
          paper: "family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500",
          arctic: "family=Albert+Sans:wght@400;500;600;700;800&family=Fragment+Mono"
        };
        var pal = P[st.palette] ? st.palette : "lofi";
        var light = false;
        try { light = window.matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
        var t = typeof P[pal] === "string" ? P[pal]
          : (st.theme === "light" ? "light" : st.theme === "system" ? (light ? "light" : "dark") : "dark");
        var r = document.documentElement;
        r.setAttribute("data-palette", pal);
        r.setAttribute("data-theme", t);
        r.setAttribute("data-mode", t);
        try {
          var l = document.createElement("link");
          l.id = "cs-fonts-" + pal; l.rel = "stylesheet";
          l.href = "https://fonts.googleapis.com/css2?" + F[pal] + "&display=swap";
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>

    <!-- Base fonts (code + UI body). Palette fonts are added lazily above. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Favicon: < ✓ > mark, dithered-lofi -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
